<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Warehouse 7</title>
  <meta name="theme-color" content="#15130f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Warehouse 7">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@400;600&family=VT323&display=swap">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <canvas id="view" class="layer"></canvas>
    <canvas id="hud" class="layer"></canvas>
    <div id="hurt"></div>
    <div id="storm"></div>
    <div id="touch"></div>
    <div id="stick"><div id="knob"></div></div>

    <div id="vitals">
      <div class="bar hp"><span class="k">HEALTH</span><i><b id="hpFill"></b></i><em id="hpNum">100</em></div>
      <div class="bar ar"><span class="k">ARMOUR</span><i><b id="arFill"></b></i><em id="arNum">0</em></div>
    </div>
    <div id="objective">
      <div id="clock">5:00</div>
      <div id="waveLine">First wave in 0:50</div>
      <div id="goalLine">Clear the compound to claim a base</div>
      <div id="carry" hidden>Carrying: construction crate</div>
    </div>
    <canvas id="minimap" width="100" height="100"></canvas>
    <button id="tuneBtn" type="button" hidden>TUNE</button>
    <button id="grenade" type="button" hidden aria-label="Throw grenade">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h5v2h1.5l2-1.5 1 1.3-2 1.6.6 1.1A7 7 0 1 1 9 7.2V4z"/></svg>
      <b id="grenadeN">0</b>
    </button>
    <div id="fps" hidden></div>
    <div id="partner" hidden></div>
    <div id="partnerTag" hidden><b>▼</b><span></span></div>
    <div id="weapon">
      <div id="wName">Sig P320</div>
      <div id="wAmmo"><b id="wMag">17</b><span id="wRes">/ 85</span></div>
      <div id="wOther">—</div>
    </div>
    <div id="toast"></div>
    <div id="hint">WASD · click to lock mouse · right-click aim · R reload · Q swap · E use · G grenade</div>

    <button id="context" class="btn ctx" type="button" hidden>PICK UP</button>
    <button id="swap" class="btn small" type="button">SWAP</button>
    <button id="reload" class="btn small" type="button">RELOAD</button>
    <button id="ads" class="btn mid" type="button">AIM</button>
    <button id="fire" class="btn big" type="button" aria-label="Fire">FIRE</button>

    <section id="tune" hidden></section>

    <section class="overlay" id="screen">
      <div class="card" id="card"></div>
    </section>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
